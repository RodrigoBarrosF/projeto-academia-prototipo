services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:?Defina APP_ORIGIN com o dominio HTTPS do cliente}
      DB_PATH: /app/data/dryfit.sqlite
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - dryfit-data:/app/data
      - dryfit-backups:/app/backups
volumes:
  dryfit-data:
  dryfit-backups:
